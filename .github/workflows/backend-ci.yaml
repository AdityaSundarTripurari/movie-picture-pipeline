name: Backend Continuous Integration

on:
  push:
    branches:
      - master
    paths:
      - 'starter/backend/**'

  pull_request:
    branches:
      - master
    paths:
      - 'starter/backend/**'

  workflow_dispatch:

jobs:
  backend-ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: starter/backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Pipenv
        run: |
          pip install pipenv

      - name: Install Dependencies
        run: |
          pipenv install --dev

      - name: Run Lint
        run: |
          pipenv run flake8 .

      - name: Run Tests
        run: |
          pipenv run pytest
